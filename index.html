<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FPT Play × Tetrate Enterprise Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bar:48px;--top:env(safe-area-inset-top,0px);color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:#F5F6F8}
.tabs{position:fixed;inset:0 0 auto;height:calc(var(--bar) + var(--top));padding:var(--top) 16px 0;display:flex;align-items:stretch;justify-content:center;gap:4px;background:#0F1B2D;z-index:2;overflow-x:auto}
.tabs button{font:600 14px/1 "Be Vietnam Pro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#A9B4C8;background:none;border:0;border-bottom:3px solid transparent;border-top:3px solid transparent;padding:0 18px;cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s}
.tabs button:hover{color:#fff}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:#E4501B}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:-4px;border-radius:6px}
iframe{position:fixed;left:0;top:calc(var(--bar) + var(--top));width:100%;height:calc(100% - var(--bar) - var(--top));border:0;visibility:hidden}
iframe.on{visibility:visible}
</style>
</head>
<body>
<div class="tabs" role="tablist" aria-label="Nội dung"><button role="tab" id="t-danh-gia" data-tab="danh-gia" aria-controls="p-danh-gia" aria-selected="false">Đánh giá đầu tư</button><button role="tab" id="t-khac-biet" data-tab="khac-biet" aria-controls="p-khac-biet" aria-selected="false">Khác biệt ba phiên bản</button></div>
<iframe role="tabpanel" id="p-danh-gia" data-tab="danh-gia" aria-labelledby="t-danh-gia" title="Đánh giá đầu tư" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;vi&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1, viewport-fit=cover&quot;&gt;
&lt;title&gt;FPT Play × Tetrate Enterprise Gateway: đánh giá đầu tư&lt;/title&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --well:#EEF0F4; --ink:#0F1B2D; --ink2:#47536B; --ink3:#7A859A; --hair:#E2E6ED; --hair2:#D2D8E2;
  --oss:#0D7A63; --oss-t:#E3F3EE; --com:#2A57C2; --com-t:#E6ECFA; --ent:#E4501B; --ent-t:#FDECE4;
  --pos:#0D7A63; --neg:#C23A3A; --neg-t:#FBE9E9; --amber:#A8650A; --amber-t:#FBF1DF;
  --lift:0 1px 2px rgba(15,27,45,.05), 0 14px 36px -18px rgba(15,27,45,.22);
  --display:&quot;Bricolage Grotesque&quot;,&quot;Be Vietnam Pro&quot;,ui-sans-serif,system-ui,sans-serif;
  --text:&quot;Be Vietnam Pro&quot;,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:&quot;&quot;;position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:rgba(245,246,248,.86);backdrop-filter:blur(14px)}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.12}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--com);outline-offset:3px;border-radius:6px}
.shell{max-width:1200px;margin:0 auto;padding:0 28px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:rgba(245,246,248,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.top .shell{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.brand svg{flex:0 0 auto}
.top-meta{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readbar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--ent);width:0}

/* hero */
.hero{padding:72px 0 40px}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;align-items:center}
.hero h1{font-size:clamp(40px,5.6vw,76px);font-weight:800;letter-spacing:-.035em;line-height:1.02}
.hero h1 .l2{display:block;color:var(--ink3);font-weight:500}
.hero .lede{margin-top:28px;font-size:19px;line-height:1.6;color:var(--ink2);max-width:46ch}
.byline{margin-top:28px;padding-top:20px;border-top:1px solid var(--hair2);font-size:14px;color:var(--ink3);max-width:46ch}
.stage{background:var(--surface);border-radius:24px;box-shadow:var(--lift);padding:22px 22px 18px;position:relative}
.stage svg{display:block;width:100%;height:auto}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--well);border-radius:12px;padding:4px;isolation:isolate}
.seg button{position:relative;z-index:1;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;border-radius:9px;transition:color .3s}
.seg button[aria-pressed=&quot;true&quot;]{color:var(--ink)}
.seg .ind{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:9px;background:var(--surface);box-shadow:0 1px 2px rgba(15,27,45,.08),0 4px 12px -4px rgba(15,27,45,.18);transition:left .45s cubic-bezier(.3,.9,.2,1),width .45s cubic-bezier(.3,.9,.2,1)}
.stage-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border-top:1px solid var(--hair)}
.lyr{padding:12px 12px 2px 0;font-size:13px;line-height:1.45;color:var(--ink3);transition:color .35s}
.lyr b{display:flex;align-items:center;gap:7px;font-size:13.5px;color:inherit;margin-bottom:2px}
.lyr i{width:9px;height:9px;border-radius:50%;border:2px solid currentColor;transition:background .35s}
.lyr.on{color:var(--ink2)}
.lyr.on b{color:var(--ink)}
.lyr.on.k0 i{background:var(--ink);border-color:var(--ink)}
.lyr.on.k1 i{background:var(--com);border-color:var(--com)}
.lyr.on.k2 i{background:var(--ent);border-color:var(--ent)}
.stage-cap{margin-top:14px;font-size:15px;color:var(--ink2);min-height:48px}

/* summary strip */
.brief{margin:40px 0 0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);}
.brief div{padding:20px 24px 4px 0}
.brief div+div{padding-left:24px;border-left:1px solid var(--hair2)}
.brief h3{font-size:22px;font-weight:700}
.brief p{font-size:15px;color:var(--ink2);margin-top:6px}

/* doc layout */
.doc{display:grid;grid-template-columns:200px minmax(0,1fr);gap:56px;padding:48px 0 0}
.toc{position:sticky;top:96px;align-self:start;font-size:14px}
.toc a{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:7px 0;color:var(--ink3);text-decoration:none;border-left:2px solid transparent;padding-left:12px;margin-left:-14px;transition:color .2s,border-color .2s}
.toc a span{font-family:var(--display);font-weight:500}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--ink);border-left-color:var(--ent)}
.chap{padding:56px 0 72px;border-top:1px solid var(--hair2)}
.chap-h{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:baseline;margin-bottom:12px}
.chap-n{font-family:var(--display);font-size:56px;line-height:.9;font-weight:400;color:var(--hair2);letter-spacing:-.04em}
.chap-h h2{font-size:clamp(28px,3.4vw,42px);font-weight:700;max-width:22ch}
.chap-lede{color:var(--ink2);font-size:17px;max-width:62ch;margin:0 0 36px}
.prose{max-width:62ch}
.fine{font-size:13.5px;color:var(--ink3);line-height:1.55}
.aside-note{display:flex;gap:12px;font-size:14px;color:var(--ink2);margin-top:20px;max-width:70ch}
.aside-note::before{content:&quot;&quot;;flex:0 0 3px;border-radius:3px;background:var(--hair2)}

/* chapter 1: spectrum */
.spectrum{position:relative;padding-top:8px}
.spec-axis{position:relative;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--oss),var(--com) 50%,var(--ent));margin:0 0 30px}
.spec-ends{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--ink3);margin-bottom:10px}
.spec-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.spec-col{position:relative;padding-top:4px}
.spec-col::before{content:&quot;&quot;;position:absolute;top:-40px;left:0;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--c);box-shadow:0 0 0 4px var(--paper)}
.spec-col h3{font-size:24px;color:var(--c)}
.spec-col .kind{font-size:14px;font-weight:600;margin-top:4px}
.spec-col ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;font-size:15px;color:var(--ink2)}
.spec-col li{display:flex;gap:10px}
.spec-col li::before{content:&quot;&quot;;flex:0 0 6px;height:6px;border-radius:50%;margin-top:10px;background:var(--c)}
.spec-col .sells{margin-top:18px;padding-top:12px;border-top:1px solid var(--hair2);font-size:14px;color:var(--ink3)}
.spec-col .sells b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;font-weight:600}
.pull{margin-top:44px;font-family:var(--display);font-size:clamp(22px,2.6vw,30px);font-weight:500;line-height:1.3;letter-spacing:-.015em;max-width:34ch}

/* chapter 2: problem explorer */
.explorer{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;background:var(--surface);border-radius:24px;box-shadow:var(--lift);overflow:hidden}
.plist{border-right:1px solid var(--hair);padding:10px;display:flex;flex-direction:column;gap:2px;background:#FAFBFC}
.ptab{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:14px 14px;border-radius:12px;transition:background .2s}
.ptab .t{font-weight:600;font-size:15px;line-height:1.3}
.ptab .s{grid-column:1;font-size:12.5px;color:var(--ink3)}
.ptab .lv{grid-row:1/3;grid-column:2;align-self:center;display:flex;gap:3px}
.ptab .lv i{width:5px;height:16px;border-radius:2px;background:var(--hair2)}
.ptab .lv i.f{background:var(--ink)}
.ptab:hover{background:var(--well)}
.ptab[aria-selected=&quot;true&quot;]{background:var(--surface);box-shadow:0 1px 2px rgba(15,27,45,.06),0 6px 16px -10px rgba(15,27,45,.25)}
.ptab[aria-selected=&quot;true&quot;] .lv i.f{background:var(--ent)}
.ppanel{padding:36px 40px 40px;min-width:0}
.ppanel[hidden]{display:none}
.ppanel h3{font-size:28px;font-weight:700;max-width:24ch}
.ppanel .intro{margin-top:10px;color:var(--ink2);max-width:62ch}
.verdict{margin-top:28px;display:flex;align-items:baseline;gap:14px;padding-top:18px;border-top:1px solid var(--hair)}
.verdict span{font-size:13px;color:var(--ink3)}
.verdict b{font-family:var(--display);font-size:22px;font-weight:700}
.verdict em{font-style:normal;font-size:14px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--well);color:var(--ink)}
.btn svg{flex:0 0 auto}

/* timeline */
.tlv{margin-top:30px;position:relative}
.tlv-grid{position:relative;margin-left:150px}
.tlv-ticks{position:relative;height:22px;font-size:12px;color:var(--ink3)}
.tlv-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tlv-ticks span::after{content:&quot;&quot;;position:absolute;left:50%;top:22px;width:1px;height:104px;background:var(--hair)}
.tlv-row{display:grid;grid-template-columns:150px 1fr;align-items:center;height:52px;margin-left:-150px}
.tlv-row b{font-size:14px;font-weight:600;line-height:1.25;padding-right:12px}
.tlv-row b small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.tlv-track{position:relative;height:30px}
.tlv-bar{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:6px;overflow:hidden;transition:width 1.5s cubic-bezier(.25,.9,.25,1)}
.tlv-bar.o{background:var(--oss)} .tlv-bar.e{background:var(--ent)}
.tlv-end{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:#fff;white-space:nowrap;opacity:0;transition:opacity .4s 1.2s}
.tlv.go .tlv-end{opacity:1}
.tlv-gain{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px);border-left:2px solid #fff;opacity:0;transition:opacity .5s 1.5s;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.tlv.go .tlv-gain{opacity:1}
.scrub{position:absolute;top:22px;bottom:0;width:0;pointer-events:none}
.scrub::before{content:&quot;&quot;;position:absolute;top:0;bottom:-10px;left:-1px;width:2px;background:var(--ink)}
.scrub .knob{position:absolute;bottom:-26px;left:0;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px -4px rgba(15,27,45,.4)}
.scrub-input{position:absolute;left:0;right:0;bottom:-34px;height:56px;margin:0;opacity:0;cursor:ew-resize}
.scrub-input:focus-visible+.scrub .knob{outline:2.5px solid var(--com);outline-offset:2px}
.tl-read{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rd{border-radius:14px;padding:14px 16px;background:var(--well);font-size:14px;color:var(--ink2);transition:background .3s}
.rd b{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.rd b i{width:8px;height:8px;border-radius:50%}
.rd.ok b i{background:var(--pos)} .rd.no{background:var(--neg-t)} .rd.no b i{background:var(--neg)}
.work{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.work ol{margin:10px 0 0;padding:0;list-style:none;counter-reset:w;display:grid;gap:0}
.work li{counter-increment:w;display:grid;grid-template-columns:28px 1fr;padding:9px 0;border-bottom:1px solid var(--hair);font-size:15px}
.work li::before{content:counter(w);font-family:var(--display);color:var(--ink3);font-weight:500}

/* cve */
.lanes{margin-top:26px;display:grid;gap:26px}
.lane h4{font-family:var(--text);font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.lane h4 i{width:10px;height:10px;border-radius:3px}
.chain{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.chain::before{content:&quot;&quot;;position:absolute;left:12px;right:12px;top:12px;height:2px;background:var(--hair)}
.chain .fill{position:absolute;left:12px;top:12px;height:2px;width:0;background:var(--c);transition:width .6s linear}
.node{position:relative;padding-top:34px;font-size:13.5px;line-height:1.4;color:var(--ink3);transition:color .3s}
.node::before{content:&quot;&quot;;position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--hair2);transition:background .3s,border-color .3s,transform .3s}
.node.lit{color:var(--ink)}
.node.lit::before{background:var(--c);border-color:var(--c);transform:scale(1.1)}

/* incident */
.console{margin-top:24px;border:1px solid var(--hair);border-radius:18px;overflow:hidden}
.con-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:#FAFBFC;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.livepill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.livepill i{width:8px;height:8px;border-radius:50%;background:#E5343F;box-shadow:0 0 0 0 rgba(229,52,63,.5);animation:ring 1.6s infinite}
@keyframes ring{70%{box-shadow:0 0 0 7px rgba(229,52,63,0)}100%{box-shadow:0 0 0 0 rgba(229,52,63,0)}}
.con-g{display:grid;grid-template-columns:repeat(4,1fr)}
.cell{padding:16px;border-right:1px solid var(--hair)}
.cell:last-child{border-right:0}
.cell span{font-size:12.5px;color:var(--ink3)}
.cell b{display:block;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color .3s}
.cell svg{display:block;width:100%;height:42px;margin-top:6px}
.cell.bad b{color:var(--neg)}
.cell .okc{color:var(--pos)}
.con-f{padding:12px 16px;border-top:1px solid var(--hair);font-size:14px;color:var(--ink2);background:#FAFBFC}
.who{margin-top:30px}
.who-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.who-h h4{font-size:19px}
.rtab{width:100%;border-collapse:collapse;font-size:14.5px}
.rtab th,.rtab td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
.rtab th{font-weight:600;font-size:13px;color:var(--ink3)}
.rtab td:first-child{color:var(--ink2);width:34%}
.rtab td.dim{color:var(--ink3);opacity:.55}
.rtab td.sel{font-weight:600}
.sla{margin-top:30px}
.sla-g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.sla-c{border-radius:16px;padding:18px 20px;background:var(--well)}
.sla-c.p{background:var(--ent-t)}
.sla-c span{font-size:13px;color:var(--ink3);font-weight:600}
.sla-c b{display:block;font-family:var(--display);font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.sla-c.p b{color:var(--ent)}
.sla-c em{font-style:normal;font-size:13.5px;color:var(--ink2)}

/* waf + phone */
.waf{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.waf div{padding:18px;border-right:1px solid var(--hair)}
.waf div:last-child{border-right:0}
.waf span{font-size:13px;color:var(--ink3)}
.waf b{display:block;font-family:var(--display);font-size:24px;margin-top:2px}
.sw-row{display:flex;gap:14px;align-items:center;margin-top:24px;padding:14px 16px;background:var(--well);border-radius:14px;font-size:15px;font-weight:500}
.switch{position:relative;flex:0 0 48px;height:28px;border-radius:999px;background:var(--hair2);transition:background .25s}
.switch::after{content:&quot;&quot;;position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,27,45,.3);transition:transform .3s cubic-bezier(.3,.9,.2,1)}
.switch[aria-checked=&quot;true&quot;]{background:var(--ink)}
.switch[aria-checked=&quot;true&quot;]::after{transform:translateX(20px)}
.phg{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.phc{border:1.5px solid var(--hair);border-radius:16px;padding:18px;transition:opacity .4s,border-color .4s,transform .4s;position:relative}
.phc h4{font-size:18px}
.phc dl{margin:12px 0 0;display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.phc dt{color:var(--ink3)} .phc dd{margin:0;font-weight:600;text-align:right}
.phc .res{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);font-size:14px;font-weight:600}
.phc.out{opacity:.5;border-color:var(--neg);border-style:dashed}
.phc.out .res{color:var(--neg)}
.phc.in{border-color:var(--pos)}
.phc.in .res{color:var(--pos)}

/* chapter 3: dot plot */
.plot{background:var(--surface);border-radius:24px;box-shadow:var(--lift);padding:28px 32px}
.plot-h,.plot-r{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:24px;align-items:center}
.plot-h{padding-bottom:10px;border-bottom:1px solid var(--hair)}
.scale{display:grid;grid-template-columns:repeat(4,1fr);font-size:12.5px;color:var(--ink3);text-align:center}
.plot-r{padding:13px 0;border-bottom:1px solid var(--hair)}
.plot-r:last-child{border-bottom:0}
.plot-r h4{font-family:var(--text);font-size:15px;font-weight:600}
.plot-r p{font-size:13px;color:var(--ink3)}
.lane4{position:relative;height:24px}
.lane4::before{content:&quot;&quot;;position:absolute;left:12.5%;right:12.5%;top:50%;height:1px;background:repeating-linear-gradient(90deg,var(--hair2) 0 4px,transparent 4px 8px)}
.stem{position:absolute;left:12.5%;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;width:0;background:var(--c);transition:width 1s cubic-bezier(.25,.9,.25,1)}
.pin{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--surface);left:12.5%;transition:left 1s cubic-bezier(.25,.9,.25,1)}

/* chapter 4 ledger */
.ledger-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.count{font-family:var(--display);font-size:15px;color:var(--ink2)}
.count b{font-size:28px;color:var(--ink)}
.ledger{columns:2;column-gap:40px}
.lg{break-inside:avoid;display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--hair2);transition:opacity .35s}
.lg span{font-size:15.5px}
.lg em{font-style:normal;font-size:13px;font-weight:600;white-space:nowrap}
.lg.no em{color:var(--neg)} .lg.ev em{color:var(--com)} .lg.dep em{color:var(--amber)}
.lg.dim{opacity:.18}
.quote-box{margin-top:36px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;padding:24px 28px;background:var(--surface);border-radius:20px;box-shadow:var(--lift)}
.quote-box p{font-family:var(--display);font-size:22px;font-weight:500;line-height:1.35;letter-spacing:-.01em}
.quote-box .fine{font-family:var(--text);font-size:14px;margin-top:10px;font-weight:400}

/* chapter 5 tco */
.tco{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0;background:var(--surface);border-radius:24px;box-shadow:var(--lift);overflow:hidden}
.tco-in{padding:28px;border-right:1px solid var(--hair);background:#FAFBFC}
.sl{padding:12px 0;border-bottom:1px solid var(--hair)}
.sl:last-of-type{border-bottom:0}
.sl label{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink2);margin-bottom:6px}
.sl output{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.sl.cost output{color:var(--ent)}
input[type=range].r{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent}
input[type=range].r::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(var(--ink),var(--ink)) 0/var(--p,50%) 100% no-repeat,var(--hair2)}
input[type=range].r::-moz-range-track{height:4px;border-radius:4px;background:var(--hair2)}
input[type=range].r::-moz-range-progress{height:4px;border-radius:4px;background:var(--ink)}
input[type=range].r::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink);margin-top:-7px;box-shadow:0 2px 6px rgba(15,27,45,.2)}
input[type=range].r::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.sl.cost input[type=range].r::-webkit-slider-runnable-track{background:linear-gradient(var(--ent),var(--ent)) 0/var(--p,50%) 100% no-repeat,var(--hair2)}
.sl.cost input[type=range].r::-webkit-slider-thumb{border-color:var(--ent)}
.tco-out{padding:28px 32px}
.tco-kpi{display:grid;grid-template-columns:auto auto 1fr;gap:32px;align-items:end}
.tco-kpi span{font-size:13px;color:var(--ink3);display:block}
.tco-kpi b{font-family:var(--display);font-size:46px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.tco-kpi .sm b{font-size:28px}
.tco-kpi button{justify-self:end}
.pos{color:var(--pos)} .neg{color:var(--neg)}
#wf{display:block;width:100%;height:auto;margin-top:22px}

/* chapter 6 matrix */
.mx-wrap{overflow-x:auto;background:var(--surface);border-radius:24px;box-shadow:var(--lift)}
.mx{width:100%;min-width:660px;border-collapse:separate;border-spacing:0;font-size:15px}
.mx th,.mx td{padding:15px 20px;text-align:left;border-bottom:1px solid var(--hair);transition:background .25s,opacity .25s}
.mx thead th{padding-top:22px;vertical-align:bottom}
.mx thead button{font-family:var(--display);font-size:20px;font-weight:700;color:var(--c);text-align:left;padding:4px 0;border-bottom:2px solid transparent}
.mx thead button[aria-pressed=&quot;true&quot;]{border-bottom-color:var(--c)}
.mx tbody tr:last-child td{border-bottom:0}
.mx td:first-child{color:var(--ink2);font-weight:500}
.mx .g{color:var(--pos);font-weight:600}.mx .b{color:var(--neg);font-weight:600}.mx .m{color:var(--amber);font-weight:600}
.mx.focus td.off,.mx.focus th.off{opacity:.35}
.mx td.on{background:#FAFBFC}

/* chapter 7 positioning */
.pos-wrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:start}
.quad{position:relative;aspect-ratio:1.25/1;background:var(--surface);border-radius:24px;box-shadow:var(--lift);overflow:hidden}
.quad .gridl{position:absolute;inset:44px 28px 52px 56px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.quad .gridl::before{content:&quot;&quot;;position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--hair2)}
.quad .gridl::after{content:&quot;&quot;;position:absolute;top:50%;left:0;right:0;border-top:1px dashed var(--hair2)}
.ax-x{position:absolute;bottom:18px;right:28px;font-size:13px;color:var(--ink2);font-weight:600}
.ax-y{position:absolute;top:16px;left:56px;font-size:13px;color:var(--ink2);font-weight:600}
.zone{position:absolute;border-radius:24px;background:var(--ent-t);border:1.5px dashed var(--ent);opacity:.9}
.zone span{position:absolute;top:8px;left:12px;font-size:12px;font-weight:700;color:var(--ent)}
.pt{position:absolute;transform:translate(-20px,-50%);display:flex;align-items:center;gap:8px;white-space:nowrap}
.pt.lf{flex-direction:row-reverse;transform:translate(calc(-100% + 20px),-50%)}
.pt .b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;background:var(--surface);border:2px solid var(--ink);transition:transform .3s cubic-bezier(.3,.9,.2,1),background .25s,color .25s;box-shadow:0 4px 12px -4px rgba(15,27,45,.25)}
.pt .l{font-size:13px;font-weight:600;background:rgba(255,255,255,.9);padding:2px 6px;border-radius:6px}
.pt[aria-pressed=&quot;true&quot;] .b{background:var(--ink);color:#fff;transform:scale(1.15)}
.pt.rec .b{border-color:var(--ent)}
.pt.rec[aria-pressed=&quot;true&quot;] .b{background:var(--ent)}
.pdet h3{font-size:26px}
.pdet .tagl{font-size:14px;color:var(--ink3);margin-top:4px}
.pdet p.body{margin-top:14px;color:var(--ink2)}
.pdet dl{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.pdet dt{color:var(--ink3)} .pdet dd{margin:0;font-weight:600}
.asks{margin-top:56px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start}
.asks h3{font-size:26px;max-width:18ch}
.asks .sub{margin-top:10px;color:var(--ink2);font-size:15px}
.meter{margin-top:22px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink2)}
.meter .tr{flex:1;height:6px;border-radius:6px;background:var(--well);overflow:hidden}
.meter .tr i{display:block;height:100%;width:0;background:var(--pos);transition:width .45s cubic-bezier(.3,.9,.2,1)}
.ask{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:20px;box-shadow:var(--lift);overflow:hidden}
.ask li+li{border-top:1px solid var(--hair)}
.ask button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:14px;align-items:start;text-align:left;padding:16px 20px;transition:background .2s}
.ask button:hover{background:#FAFBFC}
.ask .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--hair2);display:grid;place-items:center;transition:background .2s,border-color .2s;margin-top:1px}
.ask .bx svg{opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.4,.4,1)}
.ask button[aria-pressed=&quot;true&quot;] .bx{background:var(--pos);border-color:var(--pos)}
.ask button[aria-pressed=&quot;true&quot;] .bx svg{opacity:1;transform:scale(1)}
.ask b{display:block;font-weight:600;font-size:15px}
.ask small{font-size:13.5px;color:var(--ink3)}
.caveat{margin-top:20px;padding:18px 20px;border-radius:16px;background:var(--amber-t);color:#5E3B06;font-size:15px}

/* closing */
.closing{padding:120px 0 120px;background:var(--surface);border-top:1px solid var(--hair2);margin-top:40px}
.closing p.a{font-family:var(--display);font-size:clamp(26px,3.4vw,40px);color:var(--ink3);font-weight:500;letter-spacing:-.025em;line-height:1.2;max-width:28ch}
.closing p.b{font-family:var(--display);font-size:clamp(34px,4.8vw,62px);font-weight:800;letter-spacing:-.035em;line-height:1.05;max-width:22ch;margin-top:18px}
.closing .fine{margin-top:40px;max-width:70ch}

@media (max-width:1080px){
  .doc{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
}
@media (max-width:900px){
  .hero-grid,.pos-wrap,.asks,.tco{grid-template-columns:minmax(0,1fr)}
  .tco-in{border-right:0;border-bottom:1px solid var(--hair)}
  .explorer{grid-template-columns:1fr}
  .plist{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--hair)}
  .ptab{flex:0 0 200px}
  .ppanel{padding:26px 22px 30px}
  .spec-cols{grid-template-columns:1fr;gap:36px}
  .spec-col::before{display:none}
  .con-g{grid-template-columns:1fr 1fr}
  .cell:nth-child(2){border-right:0}
  .cell:nth-child(-n+2){border-bottom:1px solid var(--hair)}
  .work,.phg,.brief{grid-template-columns:1fr}
  .brief div+div{padding-left:0;border-left:0;border-top:1px solid var(--hair2)}
  .ledger{columns:1}
  .plot{padding:20px}
  .plot-h,.plot-r{grid-template-columns:1fr;gap:6px}
  .plot-h&gt;div:first-child{display:none}
  .tco-kpi{grid-template-columns:1fr 1fr}
  .tco-kpi button{grid-column:1/-1;justify-self:start}
}
@media (max-width:560px){
  .shell{padding:0 18px}
  .tlv-grid{margin-left:0}
  .tlv-row{grid-template-columns:1fr;height:auto;margin:0 0 6px;gap:4px}
  .tlv-ticks span:nth-child(even){display:none}
  .tlv-ticks span::after{display:none}
  .tl-read,.sla-g,.waf{grid-template-columns:1fr}
  .waf div{border-right:0;border-bottom:1px solid var(--hair)}
  .chain{grid-auto-flow:row}
  .chain::before,.chain .fill{display:none}
  .seg button{padding:8px 10px;font-size:13px}
  .stage-foot{grid-template-columns:1fr}
  .chap-n{font-size:40px}
  .top-meta{display:none}
}

  $(&#x27;#kNet&#x27;).textContent=(net&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+vn(net,0)+&#x27; tr&#x27;; $(&#x27;#kNet&#x27;).className=net&gt;=0?&#x27;pos&#x27;:&#x27;neg&#x27;;
  $(&#x27;#kRoi&#x27;).textContent=roi.toLocaleString(&#x27;vi-VN&#x27;,{minimumFractionDigits:1,maximumFractionDigits:1})+&#x27;%&#x27;; $(&#x27;#kRoi&#x27;).className=roi&gt;=0?&#x27;pos&#x27;:&#x27;neg&#x27;;
  const W=600,H=300,top=30,base=244,mx=Math.max(val,cost,1)*1.08, y=v=&gt;base-(v/mx)*(base-top);
  const cols=[...items.map(i=&gt;({n:i[0],a:0,b:i[1],c:&#x27;#0F1B2D&#x27;})),{n:&#x27;Giá trị&#x27;,a:0,b:val,c:&#x27;#0D7A63&#x27;,tot:1},{n:&#x27;Chi phí&#x27;,a:0,b:cost,c:&#x27;#E4501B&#x27;,tot:1},{n:&#x27;Ròng&#x27;,a:Math.min(val,cost),b:Math.max(val,cost),c:net&gt;=0?&#x27;#0D7A63&#x27;:&#x27;#C23A3A&#x27;,net:1}];

.seg button{position:relative;z-index:1;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;border-radius:9px;text-align:center;transition:color .3s}
.seg button[aria-pressed=&quot;true&quot;]{color:var(--ink)}
.seg .ind{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:9px;background:var(--surface);box-shadow:0 1px 2px rgba(15,27,45,.08),0 4px 12px -4px rgba(15,27,45,.18);transition:left .45s cubic-bezier(.3,.9,.2,1),width .45s cubic-bezier(.3,.9,.2,1)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:14px}
.btn.sec{background:var(--well);color:var(--ink)}

/* 1 layers */
.layers{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:center}
.lstack{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:150px 1fr;align-items:stretch;gap:14px}
.lrow .who{font-family:var(--display);font-weight:700;font-size:19px;align-self:center}
.bars{display:flex;gap:6px}
.blk{border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.35;color:#fff;flex:1;opacity:0;transform:scaleX(.6);transform-origin:left;transition:opacity .5s,transform .6s cubic-bezier(.3,.9,.2,1)}
.blk b{display:block;font-size:14.5px}
.blk small{opacity:.85;font-size:12.5px}
.in .blk{opacity:1;transform:none}
.blk.k0{background:var(--ink)} .blk.k1{background:var(--com)} .blk.k2{background:var(--ent)}
.same{display:grid;gap:14px}
.same .chip{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--surface);border-radius:14px;box-shadow:var(--lift);font-weight:600}
.same .chip i{width:28px;height:28px;border-radius:8px;background:var(--oss-t);display:grid;place-items:center;flex:0 0 auto}

/* 2 sorter */
.sorter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.bucket{background:var(--surface);border-radius:20px;box-shadow:var(--lift);padding:18px;display:flex;flex-direction:column;gap:12px;min-height:260px}
.bucket header h3{font-size:17px;line-height:1.25}
.bucket header p{font-size:13px;color:var(--ink3);margin-top:4px}
.bucket header .n{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;color:var(--c);display:block;margin-bottom:6px}
.bucket .pile{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.cap{border:1.5px solid var(--hair2);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;background:var(--soft);opacity:0;transform:translateY(-14px) scale(.96);transition:opacity .45s,transform .55s cubic-bezier(.3,1.3,.4,1),border-color .2s,background .2s,color .2s}
.sorted .cap{opacity:1;transform:none}
.cap.pend{border-style:dashed}
.cap[aria-pressed=&quot;true&quot;]{background:var(--ink);border-color:var(--ink);color:#fff}
.capdet{margin-top:16px;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:0;min-height:150px;overflow:hidden}
.capdet .l{padding:24px;border-right:1px solid var(--hair)}
.capdet .l h3{font-size:24px}
.capdet .l p{margin-top:8px;font-size:14.5px;color:var(--ink2)}
.capdet .r{display:grid;grid-template-columns:repeat(3,1fr)}
.capdet .r div{padding:24px 20px;border-right:1px solid var(--hair)}
.capdet .r div:last-child{border-right:0}
.capdet .r span{font-size:13px;font-weight:600}
.capdet .r b{display:block;font-family:var(--display);font-size:20px;margin-top:6px;line-height:1.25}
.y{color:var(--pos)} .x{color:var(--neg)} .m{color:var(--amber)}

/* 3 waf */
.waf{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:0;overflow:hidden}
.waf-t{padding:28px 30px}
.own{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:16px}
.own th,.own td{padding:12px 10px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:middle}
.own th{font-size:13px;color:var(--ink3);font-weight:600}
.own tr:last-child td{border-bottom:0}
.who-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;transition:background .3s,color .3s}
.who-chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.w-fpt{background:var(--ent-t);color:#B23C0F} .w-tet{background:var(--com-t);color:var(--com)}
.own code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--well);padding:2px 6px;border-radius:6px}
.effort{padding:28px 30px;background:var(--soft);border-left:1px solid var(--hair)}
.effort h4{font-size:18px}
.meterbig{margin-top:18px;display:grid;gap:14px}
.mb span{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between}
.mb .t{height:12px;border-radius:999px;background:var(--well);overflow:hidden;margin-top:6px}
.mb .t i{display:block;height:100%;border-radius:999px;width:0;transition:width .7s cubic-bezier(.3,.9,.2,1)}
.effort .key{margin-top:22px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--hair);font-size:14.5px}

/* 4 enterprise */
.ex{display:grid;grid-template-columns:250px minmax(0,1fr);overflow:hidden}
.plist{border-right:1px solid var(--hair);padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--soft)}
.ptab{display:grid;gap:2px;padding:14px;border-radius:12px;transition:background .2s}
.ptab .t{font-weight:600;font-size:15px;line-height:1.3}
.ptab .s{font-size:12.5px;color:var(--ink3)}
.ptab .s b{font-weight:600}
.ptab:hover{background:var(--well)}
.ptab[aria-selected=&quot;true&quot;]{background:var(--surface);box-shadow:0 1px 2px rgba(15,27,45,.06),0 6px 16px -10px rgba(15,27,45,.25)}
.pp{padding:34px 38px 38px;min-width:0}
.pp[hidden]{display:none}
.pp h3{font-size:28px;max-width:26ch}
.pp .intro{margin-top:10px;color:var(--ink2);max-width:64ch}

.flowhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.alert{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:10px;background:var(--neg-t);color:var(--neg);font-weight:600;font-size:14px}
.alert i{width:8px;height:8px;border-radius:50%;background:var(--neg);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(194,58,58,.45)}70%{box-shadow:0 0 0 7px rgba(194,58,58,0)}100%{box-shadow:0 0 0 0 rgba(194,58,58,0)}}
.flow{margin-top:18px;display:grid;gap:0;position:relative}
.fs{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--hair)}
.fs:last-child{border-bottom:0}
.fs .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--well);color:var(--ink2)}
.fs h4{font-family:var(--text);font-size:15.5px;font-weight:600}
.fs p{font-size:14px;color:var(--ink2);margin-top:2px;transition:opacity .25s}
.fs .who-chip{margin-top:4px}
.summary{margin-top:16px;padding:16px 18px;border-radius:14px;font-size:15px;font-weight:600;transition:background .3s,color .3s}

.tlv{margin-top:30px}
.trow{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center;margin:12px 0}
.trow b{font-size:14px;line-height:1.3}
.trow b small{display:block;color:var(--ink3);font-weight:500;font-size:12.5px}
.track{position:relative;height:34px;background:var(--well);border-radius:8px;overflow:hidden}
.tbar{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;transition:width 1.4s cubic-bezier(.25,.9,.25,1);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
.tbar.o{background:var(--oss)} .tbar.e{background:var(--ent)}
.tbar.q{background:repeating-linear-gradient(135deg,var(--oss-t) 0 7px,#fff 7px 14px);border:1.5px dashed var(--oss);color:var(--oss)}
.tick{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;font-size:12px;color:var(--ink3)}
.tick div{display:flex;justify-content:space-between}

.match{margin-top:22px;border:1px solid var(--hair);border-radius:18px;overflow:hidden}
.match-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--hair)}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#E5343F;animation:ring 1.6s infinite}
.kpis{display:grid;grid-template-columns:repeat(3,1fr)}
.kpis div{padding:16px;border-right:1px solid var(--hair)}
.kpis div:last-child{border-right:0}
.kpis span{font-size:12.5px;color:var(--ink3)}
.kpis b{display:block;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .3s}
.kpis .bad b{color:var(--neg)}
.match .fine{padding:10px 16px;border-top:1px solid var(--hair);background:var(--soft)}
.team{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:28px;margin-top:26px;align-items:start}
.team svg{display:block;width:100%;height:auto}
.deep h4{font-size:18px}
.deep .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.deep .chips button{border:1.5px solid var(--hair2);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;transition:all .2s}
.deep .chips button[aria-pressed=&quot;true&quot;]{background:var(--ink);color:#fff;border-color:var(--ink)}
.deep .dd{margin-top:12px;font-size:14.5px;color:var(--ink2);min-height:66px}
.warnbox{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--amber-t);color:#5E3B06;font-size:14.5px}
.warnbox b{display:block;margin-bottom:2px}

.ph3{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.phc{border:1.5px solid var(--hair);border-radius:16px;padding:18px;transition:border-color .3s,background .3s,opacity .3s}
.phc h4{font-size:18px}
.phc p{font-size:14px;color:var(--ink2);margin-top:8px}
.phc .st{margin-top:12px;font-weight:700;font-size:14px}
.compare-row{margin-top:18px}
.phc.lo{opacity:.4}
.phc.hi{border-color:var(--ink);background:var(--soft)}

/* 5 matrix */
.mxw{overflow-x:auto}
.mx{width:100%;min-width:680px;border-collapse:collapse;font-size:15px}
.mx th,.mx td{padding:13px 18px;text-align:left;border-bottom:1px solid var(--hair);transition:opacity .3s,background .3s}
.mx thead th{font-family:var(--display);font-size:18px;padding-top:20px}
.mx thead th:nth-child(2){color:var(--oss)} .mx thead th:nth-child(3){color:var(--com)} .mx thead th:nth-child(4){color:var(--ent)}
.mx tbody tr:last-child td{border-bottom:0}
.mx td:first-child{font-weight:500;color:var(--ink2)}
.ic{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ic svg{flex:0 0 auto}
.mx.diff tr.eq td{opacity:.28}
.mx tr.df td:first-child{color:var(--ink)}
.mx-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 18px 0}
.sw{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:500}
.switch{position:relative;flex:0 0 48px;height:28px;border-radius:999px;background:var(--hair2);transition:background .25s}
.switch::after{content:&quot;&quot;;position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,27,45,.3);transition:transform .3s cubic-bezier(.3,.9,.2,1)}
.switch[aria-checked=&quot;true&quot;]{background:var(--ink)}
.switch[aria-checked=&quot;true&quot;]::after{transform:translateX(20px)}

/* 6 value */
.val{padding:10px 28px}
.vr{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr) minmax(0,3fr);gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--hair);transition:opacity .35s}
.vr:last-child{border-bottom:0}
.vr h4{font-family:var(--text);font-size:15.5px;font-weight:600}
.vr p{font-size:13px;color:var(--ink3)}
.lv{position:relative;height:26px}
.lv::before{content:&quot;&quot;;position:absolute;left:0;right:0;top:50%;height:1px;background:repeating-linear-gradient(90deg,var(--hair2) 0 4px,transparent 4px 8px)}
.lv .stem{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;width:0;background:var(--c);transition:width 1s cubic-bezier(.25,.9,.25,1)}
.lv .pin{position:absolute;top:50%;left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px #fff;transition:left 1s cubic-bezier(.25,.9,.25,1)}
.lv .pin.unk{background:#fff;border:2px dashed var(--ink3);box-shadow:none}
.lvl{font-size:13px;font-weight:700;margin-top:4px}
.excl{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px}
.excl.yes{background:var(--ent-t);color:#B23C0F}
.excl.no{background:var(--well);color:var(--ink2)}
.excl.unk{background:var(--amber-t);color:var(--amber)}
.vhead{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr) minmax(0,3fr);gap:20px;font-size:12.5px;color:var(--ink3);padding:14px 0 8px;border-bottom:1px solid var(--hair)}
.vhead .sc{display:flex;justify-content:space-between}
.vr.dim{opacity:.22}
.insight{margin-top:20px;padding:22px 26px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none}
.insight.show{opacity:1;transform:none;pointer-events:auto}
.insight p{font-family:var(--display);font-size:21px;font-weight:500;line-height:1.35}

/* 7 decide */
.dec{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:32px;align-items:start}
.ladder{padding:10px}
.rung{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:16px 18px;border-radius:16px;transition:background .2s}
.rung:hover{background:var(--soft)}
.rung[aria-pressed=&quot;true&quot;]{background:var(--well)}
.rung .top2{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rung h4{font-family:var(--text);font-size:16px;font-weight:600}
.rung .pr{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
.rung .t{height:10px;border-radius:999px;background:var(--well);overflow:hidden}
.rung[aria-pressed=&quot;true&quot;] .t{background:#fff}
.rung .t i{display:block;height:100%;border-radius:999px;width:0;transition:width 1s cubic-bezier(.3,.9,.2,1)}
.rung .t i.dash{background:repeating-linear-gradient(90deg,var(--amber) 0 8px,transparent 8px 12px)!important}
.ddet{padding:26px 28px}
.ddet h3{font-size:24px}
.ddet .pr{margin-top:4px;font-weight:700}
.ddet p{margin-top:12px;color:var(--ink2)}
.qs{margin-top:44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.q{padding:24px;display:flex;flex-direction:column;gap:12px}
.q .qn{font-family:var(--display);font-size:42px;font-weight:700;line-height:1;color:var(--ent)}
.q h4{font-size:19px;line-height:1.3}
.q .why{font-size:14px;color:var(--ink2);border-top:1px solid var(--hair);padding-top:12px;margin-top:auto}
.q .why b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}

.closing{padding:110px 0;background:var(--surface);border-top:1px solid var(--hair2)}
.closing p.a{font-family:var(--display);font-size:clamp(24px,3vw,36px);color:var(--ink3);font-weight:500;letter-spacing:-.02em;line-height:1.25;max-width:32ch}
.closing p.b{font-family:var(--display);font-size:clamp(32px,4.4vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.06;max-width:22ch;margin-top:16px}
.closing .fine{margin-top:36px;max-width:72ch}

@media (max-width:980px){
  .hero-grid,.layers,.waf,.team,.dec,.capdet{grid-template-columns:minmax(0,1fr)}
  .effort{border-left:0;border-top:1px solid var(--hair)}
  .capdet .l{border-right:0;border-bottom:1px solid var(--hair)}
  .sorter{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ex{grid-template-columns:minmax(0,1fr)}
  .plist{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--hair)}
  .ptab{flex:0 0 190px}
  .pp{padding:26px 22px 30px}
  .qs{grid-template-columns:minmax(0,1fr)}
  .nav{display:none}
}
@media (max-width:620px){
  .shell{padding:0 18px}
  .sorter,.split,.ph3,.kpis{grid-template-columns:minmax(0,1fr)}
  .bucket{min-height:0}
  .split div+div{padding-left:0;border-left:0;border-top:1px solid var(--hair2)}
  .kpis div{border-right:0;border-bottom:1px solid var(--hair)}
  .capdet .r{grid-template-columns:minmax(0,1fr)}
  .capdet .r div{border-right:0;border-bottom:1px solid var(--hair);padding:14px 20px}
  .lrow{grid-template-columns:minmax(0,1fr);gap:6px}
  .bars{flex-direction:column}
  .vr,.vhead{grid-template-columns:minmax(0,1fr);gap:8px}
  .vhead{display:none}
  .val{padding:6px 18px}
  .trow,.tick{grid-template-columns:minmax(0,1fr);gap:4px}
  .tick&gt;span{display:none}
  .fs{grid-template-columns:36px minmax(0,1fr)}
  .chap-n{font-size:40px}
  .waf-t,.effort{padding:22px 18px}
  .own{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

  &lt;p class=&quot;chap-lede&quot;&gt;Tetrate xác nhận các phiên bản TEG dùng chung mã nguồn, Helm Chart, API và CRD. Community và Enterprise không phải hai sản phẩm có năng lực xử lý API khác nhau.&lt;/p&gt;

      &lt;p class=&quot;fine&quot;&gt;Khác biệt chủ yếu nằm ở cách đóng gói phần mềm, bảo mật và bảo trì hệ thống.&lt;/p&gt;

&lt;!-- 2 --&gt;
&lt;section class=&quot;chap&quot; id=&quot;c2&quot;&gt;
  &lt;div class=&quot;chap-h&quot;&gt;&lt;span class=&quot;chap-n&quot;&gt;2&lt;/span&gt;&lt;h2&gt;Xếp từng năng lực vào đúng loại khác biệt&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;chap-lede&quot;&gt;Mười hai năng lực trong bảng so sánh, xếp theo câu hỏi: OSS thực sự không có, hay chỉ là FPT Play phải tự làm? Chọn một năng lực để xem chi tiết. Viền nét đứt là điểm còn chờ Tetrate xác nhận.&lt;/p&gt;
  &lt;div class=&quot;sorter&quot; id=&quot;sorter&quot;&gt;
    &lt;div class=&quot;bucket&quot; style=&quot;--c:var(--ink)&quot;&gt;&lt;header&gt;&lt;span class=&quot;n&quot; data-b=&quot;eq&quot;&gt;0&lt;/span&gt;&lt;h3&gt;Ngang nhau ở cả ba&lt;/h3&gt;&lt;p&gt;Năng lực xử lý API cốt lõi&lt;/p&gt;&lt;/header&gt;&lt;div class=&quot;pile&quot; data-b=&quot;eq&quot;&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;bucket&quot; style=&quot;--c:var(--neg)&quot;&gt;&lt;header&gt;&lt;span class=&quot;n&quot; data-b=&quot;worse&quot;&gt;0&lt;/span&gt;&lt;h3&gt;Community kém hơn OSS&lt;/h3&gt;&lt;p&gt;Ràng buộc chỉ có ở bản miễn phí&lt;/p&gt;&lt;/header&gt;&lt;div class=&quot;pile&quot; data-b=&quot;worse&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;card capdet&quot; id=&quot;capdet&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;

&lt;!-- 3 --&gt;
&lt;section class=&quot;chap&quot; id=&quot;c3&quot;&gt;
  &lt;div class=&quot;chap-h&quot;&gt;&lt;span class=&quot;chap-n&quot;&gt;3&lt;/span&gt;&lt;h2&gt;Community so với OSS: tích hợp WAF&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;chap-lede&quot;&gt;Giả sử FPT Play muốn chặn SQL Injection, XSS hoặc payload độc hại ngay tại API Gateway. Chuyển qua lại để xem ai làm từng việc.&lt;/p&gt;
  &lt;div class=&quot;card waf&quot;&gt;
    &lt;div class=&quot;waf-t&quot;&gt;
      &lt;div class=&quot;seg&quot; id=&quot;segWaf&quot; role=&quot;group&quot; aria-label=&quot;Phiên bản&quot;&gt;&lt;span class=&quot;ind&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;button data-v=&quot;o&quot; aria-pressed=&quot;true&quot;&gt;OSS&lt;/button&gt;&lt;button data-v=&quot;c&quot; aria-pressed=&quot;false&quot;&gt;Community&lt;/button&gt;&lt;/div&gt;
      &lt;div style=&quot;overflow-x:auto&quot;&gt;&lt;table class=&quot;own&quot; id=&quot;own&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Công việc&lt;/th&gt;&lt;th&gt;Ai chịu trách nhiệm&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;&lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;effort&quot;&gt;
      &lt;h4&gt;Phần FPT Play phải tự làm&lt;/h4&gt;
      &lt;div class=&quot;meterbig&quot;&gt;
        &lt;div class=&quot;mb&quot;&gt;&lt;span&gt;OSS &lt;b id=&quot;eO&quot;&gt;5/5 việc&lt;/b&gt;&lt;/span&gt;&lt;div class=&quot;t&quot;&gt;&lt;i id=&quot;bO&quot; style=&quot;background:var(--oss)&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;mb&quot;&gt;&lt;span&gt;Community &lt;b id=&quot;eC&quot;&gt;2/5 việc&lt;/b&gt;&lt;/span&gt;&lt;div class=&quot;t&quot;&gt;&lt;i id=&quot;bC&quot; style=&quot;background:var(--com)&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;key&quot;&gt;Chính tài liệu Envoy Gateway OSS v1.10 đã hướng dẫn tích hợp Coraza WAF. Community chủ yếu tiết kiệm effort tích hợp và bảo trì module, không mang lại năng lực bảo mật mà OSS hoàn toàn không làm được.&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;Tuning WAF rule vẫn do FPT Play tự làm ở cả hai phiên bản.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;verdict&quot;&gt;&lt;span&gt;Giá trị với FPT Play&lt;/span&gt;&lt;b&gt;Thấp đến trung bình&lt;/b&gt;&lt;em&gt;vì FPT Play đã có hạ tầng WAF do CSOC quản lý&lt;/em&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 4 --&gt;
&lt;section class=&quot;chap&quot; id=&quot;c4&quot;&gt;
  &lt;div class=&quot;chap-h&quot;&gt;&lt;span class=&quot;chap-n&quot;&gt;4&lt;/span&gt;&lt;h2&gt;Enterprise có gì mà OSS và Community không có sẵn&lt;/h2&gt;&lt;/div&gt;
  &lt;p class=&quot;chap-lede&quot;&gt;Bốn khác biệt, mỗi khác biệt kèm phạm vi: so với phiên bản nào thì nó thực sự là lợi thế.&lt;/p&gt;
  &lt;div class=&quot;card ex&quot;&gt;
    &lt;div class=&quot;plist&quot; role=&quot;tablist&quot; aria-label=&quot;Khác biệt của Enterprise&quot;&gt;
      &lt;button class=&quot;ptab&quot; role=&quot;tab&quot; id=&quot;et0&quot; aria-controls=&quot;ep0&quot; aria-selected=&quot;true&quot;&gt;&lt;span class=&quot;t&quot;&gt;Vá lỗi bảo mật Envoy&lt;/span&gt;&lt;span class=&quot;s&quot;&gt;&lt;b&gt;Rất cao&lt;/b&gt;, nếu có cam kết&lt;/span&gt;&lt;/button&gt;
      &lt;button class=&quot;ptab&quot; role=&quot;tab&quot; id=&quot;et1&quot; aria-controls=&quot;ep1&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;&lt;span class=&quot;t&quot;&gt;Vòng đời dài hơn&lt;/span&gt;&lt;span class=&quot;s&quot;&gt;&lt;b&gt;Cao&lt;/b&gt;&lt;/span&gt;&lt;/button&gt;
      &lt;button class=&quot;ptab&quot; role=&quot;tab&quot; id=&quot;et2&quot; aria-controls=&quot;ep2&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;&lt;span class=&quot;t&quot;&gt;Chuyên gia khi có sự cố Live&lt;/span&gt;&lt;span class=&quot;s&quot;&gt;&lt;b&gt;Rất cao&lt;/b&gt;, nhưng mua được cho OSS&lt;/span&gt;&lt;/button&gt;
      &lt;button class=&quot;ptab&quot; role=&quot;tab&quot; id=&quot;et3&quot; aria-controls=&quot;ep3&quot; aria-selected=&quot;false&quot; tabindex=&quot;-1&quot;&gt;&lt;span class=&quot;t&quot;&gt;Kiểm soát Phone Home&lt;/span&gt;&lt;span class=&quot;s&quot;&gt;Chỉ hơn Community&lt;/span&gt;&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;pp&quot; role=&quot;tabpanel&quot; id=&quot;ep0&quot; aria-labelledby=&quot;et0&quot;&gt;
      &lt;h3&gt;Có đơn vị chuyên trách vá lỗi bảo mật cho Envoy&lt;/h3&gt;
      &lt;p class=&quot;intro&quot;&gt;Toàn bộ API Backend đã chạy sau Envoy Gateway. Một ngày, CSOC báo có CVE nghiêm trọng trên Envoy Proxy. Chọn phiên bản để xem ai gánh từng bước.&lt;/p&gt;
      &lt;div class=&quot;flowhead&quot;&gt;
        &lt;span class=&quot;alert&quot;&gt;&lt;i&gt;&lt;/i&gt;Critical CVE trên Envoy Proxy&lt;/span&gt;
        &lt;div class=&quot;seg&quot; id=&quot;segCve&quot; role=&quot;group&quot; aria-label=&quot;Phiên bản&quot;&gt;&lt;span class=&quot;ind&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;button data-v=&quot;o&quot; aria-pressed=&quot;true&quot;&gt;OSS&lt;/button&gt;&lt;button data-v=&quot;c&quot; aria-pressed=&quot;false&quot;&gt;Community&lt;/button&gt;&lt;button data-v=&quot;e&quot; aria-pressed=&quot;false&quot;&gt;Enterprise&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow&quot; id=&quot;flow&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;summary&quot; id=&quot;cveSum&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;note&quot;&gt;Từ TEG v1.10, Enterprise dùng Tetrate Hardened Envoy, còn Community vẫn dùng Envoy upstream. Phân vai ở chế độ Enterprise là minh họa: cần Tetrate chứng minh thời gian cung cấp bản vá nhanh hơn trong thực tế.&lt;/p&gt;
      &lt;div class=&quot;verdict&quot;&gt;&lt;span&gt;Giá trị&lt;/span&gt;&lt;b&gt;Rất cao&lt;/b&gt;&lt;em&gt;nếu có cam kết xử lý CVE phù hợp&lt;/em&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;pp&quot; role=&quot;tabpanel&quot; id=&quot;ep1&quot; aria-labelledby=&quot;et1&quot; hidden&gt;
      &lt;h3&gt;Kéo dài vòng đời sử dụng công nghệ&lt;/h3&gt;
      &lt;p class=&quot;intro&quot;&gt;Duy trì một nhánh phiên bản ổn định lâu hơn mà vẫn nhận bản vá, giảm áp lực nâng cấp lớn trên nhiều Kubernetes cluster.&lt;/p&gt;
      &lt;div class=&quot;tlv&quot; id=&quot;tlv&quot;&gt;
        &lt;div class=&quot;tick&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;div&gt;&lt;span&gt;11/2026&lt;/span&gt;&lt;span&gt;05/2027&lt;/span&gt;&lt;span&gt;11/2027&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;trow&quot;&gt;&lt;b&gt;OSS 1.10.x&lt;small&gt;Upstream, 6 tháng&lt;/small&gt;&lt;/b&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;tbar o&quot; data-w=&quot;50&quot;&gt;EOL 05/05/2027&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;trow&quot;&gt;&lt;b&gt;Enterprise 1.10.x&lt;small&gt;Subscription, ~12 tháng&lt;/small&gt;&lt;/b&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;tbar e&quot; data-w=&quot;100&quot;&gt;EOS 01/11/2027&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

<script>
const tabs=[...document.querySelectorAll('.tabs button')],frames=[...document.querySelectorAll('iframe')];
function show(k,push){
  if(!tabs.some(t=>t.dataset.tab===k))k=tabs[0].dataset.tab;
  tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===k));
  frames.forEach(f=>f.classList.toggle('on',f.dataset.tab===k));
  if(push)history.replaceState(null,'','#'+k);
}
tabs.forEach((t,i)=>{
  t.addEventListener('click',()=>show(t.dataset.tab,true));
  t.addEventListener('keydown',e=>{
    const d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!d)return;
    const n=tabs[(i+d+tabs.length)%tabs.length];n.focus();show(n.dataset.tab,true);
  });
});
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
